<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Energy Monster Shooter</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#0f1724;
    font-family:Arial;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(to bottom,#1c2940,#0a0f18);
}

/* 바닥 */

#ground{
    width:100%;
    height:130px;
    background:#243524;
    position:absolute;
    bottom:0;
}

/* UI */

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    z-index:999;
}

#title{
    font-size:38px;
    color:#ffd84d;
}

#stage{
    margin-top:10px;
    font-size:28px;
}

#target{
    margin-top:15px;
    font-size:30px;
    color:#ffb347;
}

.inputBox{
    margin-top:15px;
    font-size:24px;
}

.inputBox input{
    width:120px;
    height:45px;
    font-size:22px;
    border:none;
    border-radius:10px;
    padding-left:10px;
}

#energyText{
    margin-top:15px;
    font-size:25px;
    color:#00ffcc;
}

#message{
    margin-top:20px;
    font-size:28px;
    height:50px;
}

/* 발사체 생성기 */

#generator{
    width:120px;
    height:120px;
    position:absolute;
    left:90px;
    bottom:150px;
}

#generatorBody{
    width:100%;
    height:100%;
    background:#4da6ff;
    border-radius:20px;
    box-shadow:0 0 25px #4da6ff;
    position:absolute;
}

#cannon{
    width:60px;
    height:18px;
    background:#d9d9d9;
    position:absolute;
    right:-40px;
    top:50px;
    border-radius:10px;
}

/* 괴물 */

#monster{
    position:absolute;
    bottom:150px;
}

#monsterBody{
    width:100%;
    height:100%;
    background:#ff5c5c;
    border-radius:50%;
    position:absolute;
    box-shadow:0 0 35px red;
}

.eye{
    width:14px;
    height:14px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:30%;
}

#eye1{
    left:25%;
}

#eye2{
    right:25%;
}

.horn{
    width:20px;
    height:35px;
    background:white;
    position:absolute;
    top:-15px;
    border-radius:10px;
}

#horn1{
    left:20px;
    transform:rotate(-20deg);
}

#horn2{
    right:20px;
    transform:rotate(20deg);
}

/* 발사체 */

.projectile{
    position:absolute;
    border-radius:50%;
}

/* 폭발 효과 */

.effect{
    position:absolute;
    font-size:60px;
    animation:boom 0.7s forwards;
}

@keyframes boom{

    0%{
        opacity:1;
        transform:scale(0.5);
    }

    100%{
        opacity:0;
        transform:scale(2);
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="ground"></div>

    <!-- UI -->

    <div id="ui">

        <div id="title">
            ⚡ Kinetic Energy Shooter
        </div>

        <div id="stage">
            Stage 1
        </div>

        <div id="target">
            목표 운동에너지 :
            <span id="targetEnergy"></span> J
        </div>

        <div class="inputBox">
            질량 (m) :
            <input type="number" id="massInput">
        </div>

        <div class="inputBox">
            속도 (v) :
            <input type="number" id="velocityInput">
        </div>

        <div id="energyText">
            생성 운동에너지 : 0 J
        </div>

        <div style="margin-top:15px;font-size:20px;">
            ENTER : 발사
        </div>

        <div id="message"></div>

    </div>

    <!-- 생성기 -->

    <div id="generator">

        <div id="generatorBody"></div>

        <div id="cannon"></div>

    </div>

    <!-- 괴물 -->

    <div id="monster">

        <div id="monsterBody"></div>

        <div class="eye" id="eye1"></div>
        <div class="eye" id="eye2"></div>

        <div class="horn" id="horn1"></div>
        <div class="horn" id="horn2"></div>

    </div>

</div>

<script>

/* =========================
   기본 변수
========================= */

const monster =
document.getElementById("monster");

let stage = 1;

let targetEnergy;

let monsterX;

let projectiles = [];

/* =========================
   운동에너지 공식
========================= */

function kineticEnergy(m,v){

    return 0.5 * m * v * v;

}

/* =========================
   몬스터 생성
========================= */

function spawnMonster(){

    /* 몬스터 크기 증가 */

    let size =
    100 + stage * 20;

    if(stage >= 5){

        size = 240;
    }

    monster.style.width =
    size + "px";

    monster.style.height =
    size + "px";

    /* 몬스터 위치 */

    monsterX =
    window.innerWidth - 250;

    /* 정답 생성 */

    let m =
    (Math.floor(Math.random()*5)+1)*2;

    let v =
    Math.floor(Math.random()*5)+2;

    targetEnergy =
    kineticEnergy(m,v);

    document.getElementById("targetEnergy")
    .innerText =
    targetEnergy;

}

spawnMonster();

/* =========================
   폭발 효과
========================= */

function effect(x,y,text,color){

    const e =
    document.createElement("div");

    e.className = "effect";

    e.innerHTML = text;

    e.style.left = x + "px";

    e.style.top = y + "px";

    e.style.color = color;

    document.getElementById("game")
    .appendChild(e);

    setTimeout(()=>{

        e.remove();

    },700);

}

/* =========================
   게임오버
========================= */

function gameOver(msg){

    alert(msg);

    location.reload();

}

/* =========================
   발사
========================= */

function shoot(){

    let mass =
    parseInt(
    document.getElementById("massInput").value
    );

    let velocity =
    parseInt(
    document.getElementById("velocityInput").value
    );

    if(
        isNaN(mass) ||
        isNaN(velocity)
    ){

        return;

    }

    if(
        mass <= 0 ||
        velocity <= 0
    ){

        return;

    }

    let energy =
    kineticEnergy(mass,velocity);

    document.getElementById("energyText")
    .innerText =
    "생성 운동에너지 : " +
    energy + " J";

    /* 운동에너지 판정 */

    if(energy !== targetEnergy){

        /* 부족 */

        if(energy < targetEnergy){

            effect(
            monsterX,
            200,
            "🛡",
            "cyan"
            );

            gameOver(
            "운동에너지가 부족했다!"
            );

        }

        /* 과잉 */

        else{

            effect(
            180,
            250,
            "💥",
            "red"
            );

            gameOver(
            "운동에너지가 너무 커서 폭발했다!"
            );

        }

        return;
    }

    /* =========================
       발사체 생성
    ========================= */

    const projectile =
    document.createElement("div");

    projectile.className =
    "projectile";

    /* 질량 → 크기 */

    let size =
    18 + mass * 4;

    projectile.style.width =
    size + "px";

    projectile.style.height =
    size + "px";

    /* 속도 → 이동속도 */

    let speed =
    6 + velocity * 2;

    /* 색 변화 */

    let glow =
    Math.min(255,
    80 + energy);

    projectile.style.background =
    `rgb(255,${255-glow/2},0)`;

    projectile.style.boxShadow =
    `0 0 25px rgb(255,${255-glow/2},0)`;

    let px = 180;
    let py = window.innerHeight - 215;

    projectile.style.left =
    px + "px";

    projectile.style.top =
    py + "px";

    document.getElementById("game")
    .appendChild(projectile);

    projectiles.push({

        el:projectile,

        x:px,

        speed:speed

    });

}

/* =========================
   메인 루프
========================= */

function gameLoop(){

    /* 몬스터 이동 */

    monsterX -=
    0.45 + stage * 0.1;

    monster.style.left =
    monsterX + "px";

    /* 몬스터 흔들림 */

    if(stage >= 4){

        let move =
        Math.sin(Date.now()/250) * 25;

        monster.style.bottom =
        (150 + move) + "px";

    }

    /* 생성기 도달 */

    if(monsterX <= 170){

        gameOver(
        "괴물이 생성기에 도달했다!"
        );

    }

    /* 발사체 이동 */

    projectiles.forEach((p,index)=>{

        p.x += p.speed;

        p.el.style.left =
        p.x + "px";

        /* 충돌 */

        if(
            p.x + 40 > monsterX
        ){

            effect(
            monsterX,
            220,
            "💥",
            "white"
            );

            p.el.remove();

            projectiles.splice(index,1);

            stage++;

            if(stage >= 7){

                alert(
                "🎉 모든 괴물을 처치했다!"
                );

                location.reload();

            }

            document.getElementById("stage")
            .innerText =
            "Stage " + stage;

            document.getElementById("message")
            .innerText =
            "정확한 운동에너지 성공!";

            spawnMonster();

        }

    });

    requestAnimationFrame(gameLoop);

}

gameLoop();

/* =========================
   ENTER 발사
========================= */

document.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

        shoot();

    }

});

</script>

</body>
</html>
