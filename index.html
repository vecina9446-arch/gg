<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Energy Shooter</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#0f1724;
    font-family:Arial;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom,#1c2940,#0a0f18);
}

#ground{
    width:100%;
    height:130px;
    background:#243524;
    position:absolute;
    bottom:0;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    z-index:999;
}

#title{font-size:40px;color:#ffd84d;}
#stage{margin-top:10px;font-size:28px;}
#score{margin-top:10px;font-size:26px;color:#00ffcc;}
#monsterInfo{margin-top:10px;font-size:22px;color:#ff6666;}
#guide{margin-top:20px;font-size:22px;}
#message{margin-top:20px;font-size:28px;color:#ffb347;}

#generator{
    width:120px;
    height:120px;
    position:absolute;
}

#generatorBody{
    width:100%;
    height:100%;
    background:#4da6ff;
    border-radius:20px;
    box-shadow:0 0 25px #4da6ff;
}

#cannon{
    width:60px;
    height:18px;
    background:#d9d9d9;
    position:absolute;
    border-radius:10px;
    transform-origin:left center;
}

.monster{
    position:absolute;
    transition:transform 0.1s;
}

.monsterBody{
    width:100%;
    height:100%;
    background:#ff5c5c;
    border-radius:50%;
    box-shadow:0 0 35px red;
    position:absolute;
}

.eye{
    width:14px;height:14px;background:black;border-radius:50%;position:absolute;top:30%;
}
.eye1{left:25%;}
.eye2{right:25%;}

.horn{
    width:20px;height:35px;background:white;position:absolute;top:-15px;border-radius:10px;
}
.horn1{left:20px;transform:rotate(-20deg);}
.horn2{right:20px;transform:rotate(20deg);}

.projectile{
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    background:orange;
    box-shadow:0 0 25px orange;
}

.effect{
    position:absolute;
    font-size:60px;
    animation:boom 0.7s forwards;
}

@keyframes boom{
    0%{opacity:1;transform:scale(0.5);}
    100%{opacity:0;transform:scale(2);}
}

#quizBox{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#1b2435;
    padding:40px;
    border-radius:20px;
    color:white;
    text-align:center;
    box-shadow:0 0 30px black;
}

#quizQuestion{font-size:30px;margin-bottom:20px;}
#quizInput{
    width:170px;
    height:55px;
    font-size:30px;
    text-align:center;
    border-radius:10px;
    border:none;
}

</style>
</head>

<body>

<div id="game">

<div id="ground"></div>

<div id="ui">
<div id="title">⚡ Kinetic Energy Shooter</div>
<div id="stage">Stage 1</div>
<div id="score">Score : 0</div>
<div id="monsterInfo">몬스터 체력 : 1</div>
<div id="guide">WASD 이동 / ENTER 발사</div>
<div id="message"></div>
</div>

<div id="generator">
<div id="generatorBody"></div>
<div id="cannon"></div>
</div>

<div id="quizBox">
<div id="quizQuestion"></div>
<input id="quizInput" type="number">
</div>

</div>

<script>

const game = document.getElementById("game");
const generator = document.getElementById("generator");
const cannon = document.getElementById("cannon");

let generatorX = window.innerWidth/2;
let generatorY = window.innerHeight/2;

let velocityX = 0;
let velocityY = 0;

const keys = {};
let direction = "right";

let projectiles = [];
let monsters = [];

let stage = 1;
let score = 0;

let gamePaused = false;
let currentAnswer = 0;

let monsterHP = 1;

const quizBox = document.getElementById("quizBox");
const quizQuestion = document.getElementById("quizQuestion");
const quizInput = document.getElementById("quizInput");

function kineticEnergy(m,v){
    return 0.5*m*v*v;
}

/* 몬스터 */
function createMonster(){

    const monster = document.createElement("div");
    monster.className="monster";

    let size = 80 + stage*10;

    monster.style.width=size+"px";
    monster.style.height=size+"px";

    monster.innerHTML=`
    <div class="monsterBody"></div>
    <div class="eye eye1"></div>
    <div class="eye eye2"></div>
    <div class="horn horn1"></div>
    <div class="horn horn2"></div>
    `;

    game.appendChild(monster);

    let side = Math.floor(Math.random()*4);
    let x,y;

    if(side===0){x=Math.random()*innerWidth;y=-150;}
    if(side===1){x=innerWidth+150;y=Math.random()*innerHeight;}
    if(side===2){x=Math.random()*innerWidth;y=innerHeight+150;}
    if(side===3){x=-150;y=Math.random()*innerHeight;}

    monsters.push({
        el:monster,
        x,y,
        size,
        speed:1.5+stage*0.2,
        hp:monsterHP
    });
}

function spawnWave(){
    for(let i=0;i<stage+1;i++) createMonster();
}
spawnWave();

/* 효과 */
function effect(x,y,text,color){
    const e=document.createElement("div");
    e.className="effect";
    e.innerHTML=text;
    e.style.left=x+"px";
    e.style.top=y+"px";
    e.style.color=color;
    game.appendChild(e);
    setTimeout(()=>e.remove(),700);
}

/* 게임오버 */
function gameOver(){
    alert("💀 GAME OVER");
    location.reload();
}

/* 발사 */
function shoot(){
    if(gamePaused) return;

    const p=document.createElement("div");
    p.className="projectile";

    let px=generatorX+48;
    let py=generatorY+48;

    let vx=0,vy=0;

    if(direction==="right"){px+=70;py+=10;vx=12;}
    if(direction==="left"){px-=10;py+=10;vx=-12;}
    if(direction==="up"){px+=18;py-=10;vy=-12;}
    if(direction==="down"){px+=18;py+=70;vy=12;}

    p.style.left=px+"px";
    p.style.top=py+"px";

    game.appendChild(p);

    projectiles.push({el:p,x:px,y:py,vx,vy});
}

/* 퀴즈 (응용문제 포함) */
function startQuiz(){

    gamePaused=true;
    quizBox.style.display="block";

    let type=Math.floor(Math.random()*5);

    let m,v,e;

    let mMax=5+stage*2;
    let vMax=6+stage*2;

    if(type===0){
        m=Math.floor(Math.random()*mMax)+1;
        v=Math.floor(Math.random()*vMax)+2;
        currentAnswer=kineticEnergy(m,v);

        quizQuestion.innerHTML=`[기본]<br>m=${m}kg, v=${v}m/s<br>Ek=?`;
    }

    else if(type===1){
        m=Math.floor(Math.random()*mMax)+1;
        v=(Math.floor(Math.random()*5)+2)*2;
        e=kineticEnergy(m,v);
        currentAnswer=v;

        quizQuestion.innerHTML=`[응용] Ek=${e}J, m=${m}kg<br>v=?`;
    }

    else if(type===2){
        v=(Math.floor(Math.random()*5)+2)*2;
        m=Math.floor(Math.random()*mMax)+1;
        e=kineticEnergy(m,v);
        currentAnswer=m;

        quizQuestion.innerHTML=`[응용] Ek=${e}J, v=${v}m/s<br>m=?`;
    }

    else if(type===3){
        currentAnswer=4;
        quizQuestion.innerHTML=`[개념] 속도 2배 → 운동에너지 몇 배?`;
    }

    else{
        currentAnswer=3;
        quizQuestion.innerHTML=`[개념] 질량 3배 → 운동에너지 몇 배?`;
    }

    quizInput.value="";
    quizInput.focus();
}

function checkQuiz(){

    if(quizInput.value.trim()==="") return;

    let ans=Number(quizInput.value);

    if(ans===currentAnswer){

        quizBox.style.display="none";
        gamePaused=false;
        document.getElementById("message").innerText="정답!";
        spawnWave();

    }else{

        monsterHP++;
        document.getElementById("monsterInfo").innerText="몬스터 체력 : "+monsterHP;

        document.getElementById("message").innerText="틀림! 몬스터 강화!";
        quizBox.style.display="none";
        gamePaused=false;
        spawnWave();
    }
}

/* 루프 */
function loop(){

    if(gamePaused){
        requestAnimationFrame(loop);
        return;
    }

    let a=0.7,f=0.9,max=7;

    if(keys["a"]){velocityX-=a;direction="left";}
    if(keys["d"]){velocityX+=a;direction="right";}
    if(keys["w"]){velocityY-=a;direction="up";}
    if(keys["s"]){velocityY+=a;direction="down";}

    velocityX*=f;
    velocityY*=f;

    velocityX=Math.max(-max,Math.min(max,velocityX));
    velocityY=Math.max(-max,Math.min(max,velocityY));

    generatorX+=velocityX;
    generatorY+=velocityY;

    generatorX=Math.max(0,Math.min(innerWidth-120,generatorX));
    generatorY=Math.max(0,Math.min(innerHeight-140,generatorY));

    generator.style.left=generatorX+"px";
    generator.style.top=generatorY+"px";

    for(let i=monsters.length-1;i>=0;i--){

        let m=monsters[i];
        let dx=generatorX-m.x;
        let dy=generatorY-m.y;
        let d=Math.sqrt(dx*dx+dy*dy);

        m.x+=(dx/d)*m.speed;
        m.y+=(dy/d)*m.speed;

        m.el.style.left=m.x+"px";
        m.el.style.top=m.y+"px";

        if(d<70) gameOver();
    }

    for(let i=projectiles.length-1;i>=0;i--){

        let p=projectiles[i];
        p.x+=p.vx;
        p.y+=p.vy;

        p.el.style.left=p.x+"px";
        p.el.style.top=p.y+"px";

        if(p.x<-50||p.x>innerWidth+50||p.y<-50||p.y>innerHeight+50){
            p.el.remove();
            projectiles.splice(i,1);
            continue;
        }

        for(let j=monsters.length-1;j>=0;j--){

            let m=monsters[j];
            let dx=p.x-m.x;
            let dy=p.y-m.y;
            let d=Math.sqrt(dx*dx+dy*dy);

            if(d<m.size/2+12){

                p.el.remove();
                projectiles.splice(i,1);

                m.hp--;
                effect(m.x,m.y,"💥","orange");

                m.el.style.transform="scale(0.9)";
                setTimeout(()=>m.el.style.transform="scale(1)",100);

                if(m.hp<=0){
                    effect(m.x,m.y,"☠️","white");
                    m.el.remove();
                    monsters.splice(j,1);

                    score+=10;
                    document.getElementById("score").innerText="Score : "+score;
                }

                break;
            }
        }
    }

    if(monsters.length===0){
        stage++;
        document.getElementById("stage").innerText="Stage "+stage;
        document.getElementById("message").innerText="퀴즈!";
        startQuiz();
    }

    requestAnimationFrame(loop);
}

loop();

/* 입력 */
document.addEventListener("keydown",(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==="Enter") shoot();
});

document.addEventListener("keyup",(e)=>{
    keys[e.key.toLowerCase()]=false;
});

quizInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter") checkQuiz();
});

</script>

</body>
</html>
